name: Sync Secrets to Supabase

on:
  workflow_dispatch: # Manual trigger

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set GROQ_API_KEY in Supabase
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          supabase secrets set GROQ_API_KEY="$GROQ_API_KEY" --project-ref ybblpzymovvngtllrsbn
          echo "✅ GROQ_API_KEY synced to Supabase"
