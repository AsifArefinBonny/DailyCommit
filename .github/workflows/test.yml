name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 9:00 AM UTC
    - cron: '0 9 * * *'
    # Run tests weekly on Monday at 9:00 AM UTC for email report
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=bot --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v

      - name: Run regression tests
        run: |
          pytest tests/regression/ -v

      - name: Check coverage threshold
        run: |
          pytest tests/ --cov=bot --cov-fail-under=70

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "- Python version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Regression tests: ✅" >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install flake8 black mypy

      - name: Run flake8
        run: |
          flake8 bot/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 bot/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting
        run: |
          black --check bot/

      - name: Type checking with mypy
        run: |
          mypy bot/ --ignore-missing-imports
        continue-on-error: true  # Don't fail on type errors yet

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security checks
        run: |
          pip install bandit safety
          bandit -r bot/ -ll
          safety check --file=bot/requirements.txt
        continue-on-error: true  # Don't fail on security warnings yet

  email-report:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event.schedule == '0 9 * * 1'  # Only on weekly schedule

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate test report
        id: report
        run: |
          echo "REPORT<<EOF" >> $GITHUB_OUTPUT
          echo "# DailyCommit Weekly Test Report 📊" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Date**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          echo "**Repository**: ${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Test Results" >> $GITHUB_OUTPUT
          echo "✅ Unit Tests: ${{ needs.test.result }}" >> $GITHUB_OUTPUT
          echo "✅ Integration Tests: ${{ needs.test.result }}" >> $GITHUB_OUTPUT
          echo "✅ Regression Tests: ${{ needs.test.result }}" >> $GITHUB_OUTPUT
          echo "✅ Linting: ${{ needs.lint.result }}" >> $GITHUB_OUTPUT
          echo "✅ Security Checks: ${{ needs.security.result }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Coverage" >> $GITHUB_OUTPUT
          echo "Target: 70%" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "View full results: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram notification
        if: always()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}\",
              \"text\": \"📊 *DailyCommit Weekly Test Report*\n\n✅ Tests: ${{ needs.test.result }}\n✅ Lint: ${{ needs.lint.result }}\n✅ Security: ${{ needs.security.result }}\n\nView details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"parse_mode\": \"Markdown\"
            }"
