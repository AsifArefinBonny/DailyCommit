# Question type distribution (percentages, must sum to 100)
question_types:
  mcq: 30
  true_false: 15
  fill_in: 15
  predict_output: 15
  spot_the_bug: 10
  short_answer: 10
  scenario: 5

# Lesson settings
lesson:
  default_difficulty: 2  # 1..5
  questions_per_lesson: 3
  passage_length_target: 150  # words

# OpenRouter LLM config
llm:
  primary_model: "meta-llama/llama-3.1-8b-instruct:free"
  fallback_models:
    - "google/gemini-flash-1.5:free"
    - "mistralai/mistral-7b-instruct:free"
  max_retries: 3
  timeout_seconds: 30

# On-demand lessons
on_demand:
  daily_cap: 5  # max extra lessons via /learn per day

# Gamification
xp:
  correct_answer: 10
  perfect_lesson: 30  # bonus for 100% correct
  streak_milestone: 50  # every 7-day increment

# Tutor follow-up prompts (used by Telegram webhook)
tutor_prompts:
  explain_simply: "Explain this concept as if I'm a beginner who's never seen it before."
  senior_qa: "Explain how this applies in a real-world QA or production environment. What would a senior SDET consider?"
