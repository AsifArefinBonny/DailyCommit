[pytest]
# Pytest configuration for DailyCommit

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=bot
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    regression: Regression tests for known bugs
    slow: Slow-running tests
    requires_db: Tests that require database connection
    requires_api: Tests that require external API

# Coverage options
[coverage:run]
source = bot
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
